<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* The page is transparent and the SHAPE is CSS. A win32 region cannot do
     this job: on WebView2 the area a region excludes composites as opaque
     white (measured over a controlled backdrop), which is the white square
     that kept reappearing behind the circle. The window is created
     transparent instead, so only what CSS paints is on screen.
     The bubble is a real window captured from the screen; dragging it
     mid-recording moves it in the video, which is the point. */
  * { user-select: none; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* The shape sits inside a margin so an outer drop shadow has room to
     fall on the transparent area rather than being clipped at the window
     edge. SHADOW must match the padding used by setShape(). */
  .wrap {
    position: absolute; inset: 10px; overflow: hidden;
    cursor: grab; background: #0e0f12;
    box-shadow:
      0 6px 18px rgba(0, 0, 0, 0.45),
      0 1px 3px rgba(0, 0, 0, 0.35),
      inset 0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  /* nothing but the person: the window's transparent pixels are keyed out,
     so the screen behind shows through and gets recorded as your background */
  .wrap.cut { background: transparent; box-shadow: none; }
  canvas { display: block; width: 100%; height: 100%; }
  video { display: none; }
  .err {
    position: absolute; inset: 0; display: none; align-items: center;
    justify-content: center; text-align: center; color: #9aa0a8;
    font: 11.5px system-ui; padding: 24px;
  }
</style>
</head>
<body>
<div class="wrap pywebview-drag-region">
  <video id="cam" autoplay muted playsinline></video>
  <!-- what the segmenter is handed: see SEG_MAX below -->
  <canvas id="seg" style="display:none"></canvas>
  <canvas id="out" class="pywebview-drag-region"></canvas>
  <div class="err" id="err">Camera unavailable</div>
</div>

<script type="module">
  /* Blur pipeline ported from ai_automation/video_effect: MediaPipe
     selfie_segmenter confidence mask into the alpha channel, Canvas2D
     blur() composite — background blurred, person sharp on top. */
  const video = document.getElementById("cam");
  const out = document.getElementById("out");
  const ctx = out.getContext("2d");
  let CW = 300, CH = 170;          // canvas size, set by setShape

  let stream = null, segmenter = null, blurOn = false, running = false;
  let loadingSegmenter = null;
  let blurPx = 6;                  // background blur radius, set from settings
  let bgMode = "blur";             // "blur", "black" or "white" behind you
  // "screen" is the odd one out: it paints nothing, so the window's
  // transparent area is keyed out and the desktop behind it — the thing
  // being recorded — is your background. No disc, no shadow, just you.
  const SOLID = { black: "#000", white: "#fff" };
  const isCutout = () => bgMode === "screen";

  const blurCanvas = new OffscreenCanvas(CW, CH);
  const blurCtx = blurCanvas.getContext("2d");
  const personCanvas = new OffscreenCanvas(CW, CH);
  const personCtx = personCanvas.getContext("2d");
  const maskCanvas = new OffscreenCanvas(64, 64);
  const maskCtx = maskCanvas.getContext("2d");
  const smallCanvas = new OffscreenCanvas(64, 64);   // downscaled background
  const smallCtx = smallCanvas.getContext("2d");
  const dilateCanvas = new OffscreenCanvas(64, 64);  // grown person mask
  const dilateCtx = dilateCanvas.getContext("2d");
  // The segmenter's cost is set by the pixels it is handed, not by the size
  // of the mask it returns. Handing it the raw camera frame meant the GPU
  // chewed 3.8 megapixels per frame for a 256x256 mask: 61 ms of blocking
  // readback at this webcam's native size, which is most of why the outline
  // trailed the person. It only ever sees the part of the frame that is on
  // screen, scaled to fit SEG_MAX, so the mask lines up with the canvas
  // 1:1 and the model spends its resolution on what is actually shown.
  const SEG_MAX = 256;
  const segCanvas = document.getElementById("seg");
  const segCtx = segCanvas.getContext("2d", { alpha: false });
  let maskImageData = null;

  const SHADOW = 10;               // gap around the shape, for the shadow
  let shapeW = 488, shapeH = 274;
  function applyChrome() {
    const wrap = document.querySelector(".wrap");
    wrap.classList.toggle("cut", isCutout());
    wrap.style.borderRadius =
      isCutout() ? "0" : (shapeW === shapeH ? "50%" : "16px");
  }
  window.setShape = (w, h) => {
    shapeW = w; shapeH = h;
    // the window is (shape + SHADOW on every side); the canvas is the shape
    CW = w - SHADOW * 2; CH = h - SHADOW * 2;
    out.width = CW; out.height = CH;
    blurCanvas.width = personCanvas.width = CW;
    blurCanvas.height = personCanvas.height = CH;
    const k = SEG_MAX / Math.max(CW, CH);
    segCanvas.width = Math.max(64, Math.round(CW * k));
    segCanvas.height = Math.max(64, Math.round(CH * k));
    // circle when square, otherwise Loom's softly rounded rectangle
    applyChrome();
  };
  setShape(488, 274);

  async function loadSegmenter() {
    if (segmenter) return segmenter;
    if (!loadingSegmenter) {
      loadingSegmenter = (async () => {
        const vision = await import(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
        const files = await vision.FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
        // Multiclass model, not the binary selfie segmenter: it labels hair,
        // face-skin, body-skin, clothes and accessories separately, which is
        // what makes the outline follow a head of hair instead of cutting
        // through it. Person = anything that is not the background class.
        segmenter = await vision.ImageSegmenter.createFromOptions(files, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite",
            delegate: "GPU",
          },
          runningMode: "VIDEO",
          outputCategoryMask: true,
          outputConfidenceMasks: false,
        });
        return segmenter;
      })();
    }
    return loadingSegmenter;
  }

  // cover-crop the video frame to the canvas aspect
  function drawFrameTo(c, dw, dh) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw) return;
    const scale = Math.max(dw / vw, dh / vh);
    const sw = dw / scale, sh = dh / scale;
    c.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, dw, dh);
  }
  function drawFrame(c) {
    drawFrameTo(c, CW, CH);
  }

  // The segmenter is fed the same cover-crop the canvas shows, so its mask
  // maps straight onto the canvas. (It used to run on the whole camera
  // frame while the canvas showed a crop of it, which squashed the mask
  // against the image — a 16:9 camera in a square bubble by 1.78x — and put
  // the mask edge inside the face.)
  function drawMaskTo(c, src) {
    c.drawImage(src, 0, 0, CW, CH);
  }

  // Mask post-processing. The raw mask flickers frame to frame, which reads
  // as a shimmering halo, so it is smoothed over time; the alpha ramp is
  // kept narrow so the person's edge stays crisp instead of dissolving.
  let prevMask = null;
  // Asymmetric smoothing: claim a pixel as "person" almost immediately, let
  // go of it a little more slowly. Symmetric smoothing made the mask trail
  // behind a moving head, so the leading edge — the side of the face and
  // the ears — dropped out of the mask and got blurred.
  //
  // These are time constants in MILLISECONDS, not per-frame weights. As
  // per-frame weights, letting go took ~4 frames however long a frame
  // happened to be, so when the pipeline was running at 12 fps the outline
  // dragged a third of a second behind the person. In ms the release is the
  // same short moment whatever the frame rate.
  const RISE_MS = 12;        // how fast a pixel is claimed as person
  const FALL_MS = 45;        // ...and released again
  const EDGE = 0.5;          // alpha midpoint
  const DILATE = 3;          // mask pixels to grow the person by
  // Against a flat colour every mask pixel that is not really you is a
  // lit-room rim around your head, so the bias goes the other way there:
  // demand more confidence at the edge and shave the silhouette instead of
  // growing it. Under blur, none of that is visible and the old bias (keep
  // a sliver of background rather than blur an ear) is still the right one.
  // Two edge profiles, because the two backgrounds fail differently.
  //
  // Under blur, a mask that is slightly too big costs nothing (the sliver
  // of room it keeps is blurred anyway) and a mask that is slightly too
  // small blurs an ear, so it is grown and the edge is allowed to be soft.
  //
  // On a flat colour or a cutout, the soft edge IS the problem: a wide
  // alpha ramp draws a grey gradient ring around your head that reads as an
  // outline. Shrinking the mask fixes the ring by eating into your face -
  // measured at -3.4 points of person area, which is exactly what it looked
  // like - so the mask is left where it is and the ramp is narrowed
  // instead. Measured on a real take: ring area 3.18% of the bubble at the
  // soft settings, 1.40% here, with person area unchanged.
  const SOLID_EDGE = 0.56;   // confidence needed at the edge, on a colour
  const RAMP = 6, SOLID_RAMP = 14;      // how hard the alpha ramp is
  const FEATHER = 260, SOLID_FEATHER = 700;   // CW / this = blur px

  // The background the person is composited onto: the blurred room, or a
  // flat colour. Colour is the cheap path — no downscale, no filter, just
  // a fill.
  function paintBackground() {
    blurCtx.filter = "none";
    if (isCutout()) {
      blurCtx.clearRect(0, 0, CW, CH);
      return;
    }
    if (SOLID[bgMode]) {
      blurCtx.fillStyle = SOLID[bgMode];
      blurCtx.fillRect(0, 0, CW, CH);
      return;
    }
    // Background blur at the radius that was actually asked for. Downscaling
    // blurs on its own — a 1/3-size round trip softens the image about as
    // much as a 3px blur before the filter even runs — so the old version
    // made "2" look like a heavy blur. Only large radii downscale now, and
    // the filter is scaled to compensate.
    const shrink = blurPx > 6 ? 2 : 1;
    const bw = Math.max(32, Math.round(CW / shrink));
    const bh = Math.max(32, Math.round(CH / shrink));
    if (smallCanvas.width !== bw) { smallCanvas.width = bw; smallCanvas.height = bh; }
    smallCtx.filter = "none";
    drawFrameTo(smallCtx, bw, bh);
    blurCtx.filter = `blur(${Math.max(0.5, blurPx / shrink)}px)`;
    blurCtx.drawImage(smallCanvas, 0, 0, bw, bh, 0, 0, CW, CH);
    blurCtx.filter = "none";
  }

  let lastFrameAt = 0;
  function drawEffect(result) {
    paintBackground();
    drawFrame(personCtx);
    const mask = result.categoryMask;
    if (!mask) {
      if (isCutout()) ctx.clearRect(0, 0, CW, CH); else drawFrame(ctx);
      return;
    }
    const cats = mask.getAsUint8Array();
    const mw = mask.width, mh = mask.height;
    if (!maskImageData || maskImageData.width !== mw) {
      maskImageData = new ImageData(mw, mh);
      maskCanvas.width = mw; maskCanvas.height = mh;
      prevMask = null;
    }
    if (!prevMask || prevMask.length !== cats.length) {
      prevMask = new Float32Array(cats.length);
    }
    const px = maskImageData.data;
    const solid = !!SOLID[bgMode] || isCutout();
    const edge = solid ? SOLID_EDGE : EDGE;
    const ramp = solid ? SOLID_RAMP : RAMP;
    const now = performance.now();
    // clamped: a hidden window or a stall must not blow the mask away
    const dt = lastFrameAt ? Math.min(120, now - lastFrameAt) : 16;
    lastFrameAt = now;
    const kRise = Math.exp(-dt / RISE_MS), kFall = Math.exp(-dt / FALL_MS);
    for (let i = 0; i < cats.length; i++) {
      // category 0 is background; hair, skin, clothes and accessories are
      // all "person", which is why this follows a hairline properly
      const target = cats[i] === 0 ? 0 : 1;
      const keep = target > prevMask[i] ? kRise : kFall;
      const v = prevMask[i] * keep + target * (1 - keep);
      prevMask[i] = v;
      // narrow ramp around the midpoint: a definite edge, not a fade
      let a = (v - edge) * ramp + 0.5;
      px[i * 4 + 3] = (a < 0 ? 0 : a > 1 ? 1 : a) * 255;
    }
    maskCtx.putImageData(maskImageData, 0, 0);

    // Grow the mask a few pixels before using it. The model's edge sits
    // just inside the person, so an exact mask shaves the rim of an ear or
    // a cheek into the blurred background; better to keep a sliver of
    // background sharp than to blur part of a face.
    if (dilateCanvas.width !== mw) {
      dilateCanvas.width = mw; dilateCanvas.height = mh;
    }
    dilateCtx.clearRect(0, 0, mw, mh);
    if (solid) {
      dilateCtx.drawImage(maskCanvas, 0, 0);      // as the model drew it
    } else {
      dilateCtx.globalCompositeOperation = "lighter";
      for (let dx = -DILATE; dx <= DILATE; dx += DILATE) {
        for (let dy = -DILATE; dy <= DILATE; dy += DILATE) {
          dilateCtx.drawImage(maskCanvas, dx, dy);
        }
      }
      dilateCtx.globalCompositeOperation = "source-over";
    }

    personCtx.globalCompositeOperation = "destination-in";
    // just enough feather to hide mask pixelation at this scale
    personCtx.filter = `blur(${Math.max(0.6, CW / (solid ? SOLID_FEATHER : FEATHER))}px)`;
    drawMaskTo(personCtx, dilateCanvas);
    personCtx.filter = "none";
    personCtx.globalCompositeOperation = "source-over";

    ctx.clearRect(0, 0, CW, CH);
    ctx.drawImage(blurCanvas, 0, 0);
    ctx.drawImage(personCanvas, 0, 0);
  }

  // Driven by the camera, not by the screen: requestVideoFrameCallback
  // fires once per decoded frame, so a 30 fps camera on a 60 Hz screen is
  // segmented 30 times a second instead of 60, half of them on a frame that
  // had not changed.
  const nextFrame = (fn) => {
    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(fn);
    else requestAnimationFrame(fn);
  };

  async function loop() {
    if (!running) return;
    if (video.readyState >= 2) {
      if (blurOn && segmenter) {
        drawFrameTo(segCtx, segCanvas.width, segCanvas.height);
        const result = segmenter.segmentForVideo(segCanvas, performance.now());
        drawEffect(result);
        result.close();
      } else if (blurOn && isCutout()) {
        ctx.clearRect(0, 0, CW, CH);      // segmenter still loading
      } else {
        drawFrame(ctx);
      }
    }
    nextFrame(loop);
  }

  let camGen = 0, starting = false;
  window.startCamera = async (dshowName, blur, strength, mode) => {
    if (strength) blurPx = strength;
    if (mode) bgMode = mode;
    applyChrome();
    // single-flight: panel-show + record-start can call within ms of each
    // other — a second concurrent getUserMedia would orphan the first
    // stream and pin the camera LED on forever
    if (running || starting) return;
    starting = true;
    const g = camGen;
    blurOn = blur;
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const match = devices.find(
        (d) => d.kind === "videoinput" && d.label === dshowName);
      // The bubble is at most ~780 CSS px wide, so a 4K stream was decoded
      // and thrown away every frame. 1080p is still more than the bubble
      // can show, at its native aspect (no forcing).
      const vc = { width: { ideal: 1920 }, height: { ideal: 1080 } };
      if (match) vc.deviceId = { exact: match.deviceId };
      const s = await navigator.mediaDevices.getUserMedia({
        video: vc, audio: false,
      });
      if (g !== camGen) {   // stopCamera arrived while we were awaiting
        s.getTracks().forEach((t) => t.stop());
        return;
      }
      stream = s;
      video.srcObject = stream;
      await video.play();
      document.getElementById("err").style.display = "none";
      if (blurOn) await loadSegmenter();
      if (g !== camGen) return;   // stopped during play/segmenter setup
      running = true;
      loop();
    } catch (e) {
      document.getElementById("err").style.display = "flex";
      document.getElementById("err").textContent =
        "Camera unavailable: " + e.name;
    } finally {
      starting = false;
    }
  };

  window.setBlur = async (on, strength, mode) => {
    blurOn = on;
    if (strength) blurPx = strength;
    if (mode) bgMode = mode;
    applyChrome();
    if (on) await loadSegmenter();
  };
  window.setBlurStrength = (px) => { blurPx = px; };
  window.setBgMode = (mode) => { bgMode = mode; applyChrome(); };

  window.stopCamera = () => {
    camGen++;   // invalidates any startCamera still awaiting getUserMedia
    running = false;
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
    // deliberately NOT clearing the canvas: the last frame stays painted, so
    // reopening the card shows the picture immediately instead of a black
    // disc while the camera spins up
  };
</script>
<script>
  // page zoom persists in the WebView2 profile and breaks fixed layouts
  addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  addEventListener("keydown", (e) => {
    if (e.ctrlKey && ["=", "-", "+", "0"].includes(e.key)) e.preventDefault();
  });
</script>
</body>
</html>
