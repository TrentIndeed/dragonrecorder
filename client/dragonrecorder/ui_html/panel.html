<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Loom-style compact launcher: floats top-right of the chosen monitor,
     opened by tray or the record hotkey. Dark, near-opaque, instrument-like. */
  :root {
    --bg: #17181c; --row: #24262c; --row-hi: #2c2f36; --line: #33363d;
    --text: #e8e9eb; --muted: #9aa0a8; --live: #ff4b33; --ai: #a78bfa;
    --mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; user-select: none; }
  /* opaque: the window itself is clipped to a rounded rect by a win32
     region, so the page just fills it edge to edge */
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  .panel {
    height: 100%; background: var(--bg);
    border: 1px solid var(--line); border-radius: 18px;
    padding: 12px; color: var(--text);
    font: 13.5px system-ui, "Segoe UI", sans-serif;
  }
  .top {
    display: flex; align-items: center; gap: 4px; padding: 0 2px 10px;
    cursor: grab;
  }
  .top .mode {
    width: 38px; height: 32px; border-radius: 9px; border: none;
    background: none; color: var(--muted); display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }
  .top .mode.active { background: var(--row-hi); color: var(--ai); }
  .top .mode:disabled { color: #4a4e55; cursor: default; }
  .top .spacer { flex: 1; }
  .top .close { color: var(--muted); }
  .top .close:hover { color: var(--text); background: var(--row); }
  .top svg { width: 18px; height: 18px; fill: currentColor; }
  .brandmark {
    display: flex; align-items: center; gap: 8px; color: var(--text);
    font: 600 13px system-ui; padding-left: 2px;
  }
  .brandmark svg { fill: var(--text); }

  .row {
    display: flex; align-items: center; gap: 10px; background: var(--row);
    border: 1px solid transparent; border-radius: 11px; padding: 0 12px;
    height: 44px; margin-bottom: 8px;
  }
  .row:hover { background: var(--row-hi); }
  .row svg { width: 17px; height: 17px; fill: var(--muted); flex: none; }
  .row select {
    flex: 1 1 0; min-width: 0; background: transparent; color: var(--text);
    border: none; font: inherit; outline: none; appearance: none;
    cursor: pointer; text-overflow: ellipsis; padding-right: 4px;
  }
  .row select option { background: var(--row); color: var(--text); }
  .row .chev { margin-left: -14px; pointer-events: none; }
  .badge {
    flex: none; font-size: 11.5px; font-weight: 600; padding: 2px 9px;
    border-radius: 6px; background: #3a3d44; color: #fff;
  }
  .badge.off { background: transparent; color: #565a62; border: 1px solid #33363d; }

  .screenrow { cursor: pointer; }
  .screenlabel {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .screenpreview {
    position: relative; margin: 0 0 8px; border-radius: 11px;
    overflow: hidden; background: #101114; height: 148px;
  }
  .screenpreview img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    background: #000;
  }
  .screenlist {
    position: absolute; inset: 0; background: rgba(14, 15, 18, 0.97);
    display: flex; gap: 8px; padding: 8px; overflow-x: auto;
    align-items: center;
  }
  .screenopt {
    flex: 1; min-width: 92px; border: 2px solid var(--line);
    border-radius: 9px; overflow: hidden; cursor: pointer; background: none;
    padding: 0; position: relative;
  }
  .screenopt img { width: 100%; height: 76px; object-fit: contain;
    display: block; background: #000; }
  .screenopt .lab {
    display: block; font-size: 11px; color: var(--muted); padding: 3px 0 4px;
    text-align: center;
  }
  .screenopt.sel { border-color: var(--ai); }
  .screenopt.sel .lab { color: var(--ai); }
  .campreview {
    margin: 0 0 8px; border-radius: 11px; overflow: hidden;
    background: #000; height: 108px;
  }
  .campreview video {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  #micWave { flex: none; width: 52px; height: 22px; }
  .lastlink {
    display: flex; align-items: center; gap: 8px; margin: 2px 0 8px;
    padding: 8px 10px; background: var(--row); border-radius: 10px;
    font-size: 12px; color: var(--muted);
  }
  .lastlink .ok { color: #55c07a; font-weight: 700; }
  .lastlink .url {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--text);
  }
  .lastlink button {
    flex: none; background: var(--row-hi); border: none; color: var(--text);
    border-radius: 7px; padding: 4px 10px; font-size: 11.5px; cursor: pointer;
  }

  .start {
    width: 100%; height: 46px; margin: 4px 0 10px; border: none;
    border-radius: 11px; background: var(--live); color: #fff;
    font: 600 15px system-ui; cursor: pointer;
  }
  .start:hover { filter: brightness(1.07); }

  .tune { display: grid; gap: 1px; margin: 2px 0 2px; }
  .tunerow {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 6px 10px; border-radius: 9px;
    color: var(--muted); font: 12px system-ui;
  }
  .tunerow:hover { background: var(--row); color: var(--text); }
  /* an author display rule beats the UA [hidden] rule — say it explicitly */
  .tunerow[hidden] { display: none; }
  .tunerow input[type="range"] {
    margin-left: auto; width: 92px; accent-color: var(--ai);
  }
  .tunerow input[type="checkbox"] { margin-left: auto; accent-color: var(--ai); }
  .tunerow .num {
    width: 16px; text-align: right; font-variant-numeric: tabular-nums;
  }

  .bottom { display: flex; gap: 6px; justify-content: space-around; }
  .bottom button {
    flex: 1; background: none; border: none; border-radius: 10px;
    color: var(--muted); font: 12px system-ui; padding: 7px 0 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; position: relative;
  }
  .bottom button:hover { background: var(--row); color: var(--text); }
  .bottom button svg { width: 18px; height: 18px; fill: currentColor; }
  .bottom .dot {
    position: absolute; top: 4px; right: 22%; width: 7px; height: 7px;
    border-radius: 50%; background: var(--live); display: none;
  }
  .bottom button.on .dot { display: block; }
  .bottom button.on { color: var(--ai); }
  .err { color: var(--live); font-size: 12px; min-height: 15px; padding: 2px 4px 0; }
</style>
</head>
<body>
<div class="panel">
  <div class="top pywebview-drag-region">
    <div class="brandmark" title="DragonRecorder">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="3.6" fill="#ff4b33"/></svg>
      <span>DragonRecorder</span>
    </div>
    <div class="spacer"></div>
    <button class="mode close" id="close" title="Hide (Ctrl+Alt+C reopens; quit from the tray icon)">
      <svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19l1.4-1.4L13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
    </button>
  </div>

  <div class="row screenrow" id="screenRow" title="Screen to record">
    <svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-7v2h3v2H7v-2h3v-2H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
    <span class="screenlabel" id="screenLabel">Screen 1</span>
    <svg class="chev" viewBox="0 0 24 24" style="margin-left:auto"><path d="M7 10l5 5 5-5z"/></svg>
  </div>
  <div class="screenpreview" id="screenPreview">
    <img id="previewImg" alt="Selected screen preview" draggable="false">
    <div class="screenlist" id="screenList" hidden></div>
  </div>
  <label class="row" title="Camera bubble">
    <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    <select id="camera" aria-label="Camera"></select>
    <span class="badge off" id="camBadge">Off</span>
    <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
  </label>
  <div class="campreview" id="camPreview" hidden>
    <video id="camVid" autoplay muted playsinline></video>
  </div>
  <label class="row" title="Microphone">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    <select id="mic" aria-label="Microphone"></select>
    <canvas id="micWave" width="52" height="22"></canvas>
    <span class="badge off" id="micBadge">Off</span>
    <svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
  </label>

  <div class="tune">
    <label class="tunerow" title="Filters steady hum and hiss out of the mic and evens out quiet speech">
      <span>Clean up mic audio</span>
      <input type="checkbox" id="denoise">
    </label>
    <label class="tunerow" id="camSizeRow" title="How big the camera bubble is">
      <span>Camera size</span>
      <input type="range" id="camSize" min="50" max="160" step="5">
      <span class="num" id="camSizeVal">100</span>
    </label>
    <label class="tunerow" id="blurStrengthRow" hidden
           title="How hard the background behind you is blurred">
      <span>Blur strength</span>
      <input type="range" id="blurStrength" min="2" max="16" step="1">
      <span class="num" id="blurStrengthVal">6</span>
    </label>
  </div>

  <button class="start" id="start">Start Recording</button>
  <div class="lastlink" id="lastLink" hidden>
    <span class="ok">✓</span>
    <span>Link copied</span>
    <span class="url" id="lastUrl"></span>
    <button id="lastCopy">Copy</button>
  </div>
  <div class="err" id="err"></div>

  <div class="bottom">
    <button id="shape" title="Webcam shape: rounded rectangle / circle">
      <svg id="shapeRect" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="4"/></svg>
      <svg id="shapeCircle" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="8"/></svg>
      <span id="shapeLabel">Shape</span>
    </button>
    <button id="blur"><span class="dot"></span>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3"/></svg>
      Blur
    </button>
    <button id="more" title="Open your library">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      More
    </button>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let saveTimer;
  let loaded = false;      // guards save() until settings are on screen
  let shape = "rect";
  function renderShape() {
    $("shapeRect").style.display = shape === "rect" ? "" : "none";
    $("shapeCircle").style.display = shape === "circle" ? "" : "none";
  }

  let mons = [];
  let monIdx = 1;
  let previews = {};

  function monLabel(m) {
    return `Screen ${m.index} — ${m.width}×${m.height}${m.primary ? " (primary)" : ""}`;
  }

  function renderScreens() {
    const cur = mons.find(m => m.index === monIdx) || mons[0];
    if (cur) $("screenLabel").textContent = monLabel(cur);
    $("previewImg").src = previews[String(monIdx)] || "";
    const list = $("screenList");
    list.innerHTML = "";
    for (const m of mons) {
      const b = document.createElement("button");
      b.className = "screenopt" + (m.index === monIdx ? " sel" : "");
      b.innerHTML = `<img draggable="false"><span class="lab">Screen ${m.index}</span>`;
      b.querySelector("img").src = previews[String(m.index)] || "";
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        monIdx = m.index;
        list.hidden = true;
        renderScreens();
        save();     // moves the card + webcam to that screen
      });
      list.appendChild(b);
    }
  }

  async function refreshPreviews() {
    try {
      previews = await pywebview.api.get_previews();
      renderScreens();
    } catch (e) {}
  }
  // device streams may only run while the card is actually on screen —
  // pywebview keeps this page alive parked off-screen, and a leaked
  // getUserMedia stream keeps the physical camera LED on forever
  let panelVisible = false, panelGen = 0;
  window.onPanelShown = () => {
    panelVisible = true; panelGen++;
    refreshPreviews(); updateCamPreview(); startMicMeter();
  };

  async function load() {
    const info = await pywebview.api.get_setup();
    const fill = (sel, items, value, noneLabel) => {
      sel.innerHTML = "";
      if (noneLabel) sel.add(new Option(noneLabel, ""));
      for (const it of items) sel.add(new Option(it.label ?? it, it.value ?? it));
      sel.value = value;
      if (sel.selectedIndex === -1) sel.selectedIndex = 0;
    };
    mons = info.monitors;
    monIdx = parseInt(info.settings.monitor, 10) || 1;
    renderScreens();
    refreshPreviews();
    $("screenRow").addEventListener("click", () => {
      const list = $("screenList");
      list.hidden = !list.hidden;
      if (!list.hidden) refreshPreviews();
    });
    fill($("camera"), info.cameras, info.settings.camera, "No Camera");
    fill($("mic"), info.mics, info.settings.mic, "No Microphone");
    // the page loads at app startup while the card is parked off-screen —
    // only grab camera/mic if the card is really visible (covers the race
    // where show fired before this load finished)
    try {
      if (panelVisible || await pywebview.api.panel_visible()) {
        panelVisible = true;
        updateCamPreview();
        startMicMeter();
      }
    } catch (e) {}
    $("blur").classList.toggle("on", info.settings.blur);
    shape = info.settings.bubble_shape || "rect";
    renderShape();
    $("denoise").checked = info.settings.mic_denoise !== false;
    $("blurStrength").value = info.settings.blur_strength ?? 6;
    $("camSize").value = info.settings.bubble_scale ?? 100;
    $("camSizeVal").textContent = $("camSize").value;
    renderBlurStrength();
    updateBadges();
    if (!info.token_ok) {
      $("err").textContent = "CAPTURE_TOKEN / SERVER_URL missing in .env — uploads will fail.";
    }
    loaded = true;   // saving before this point would persist empty defaults
  }

  // every control on the card funnels through here, so nothing can be
  // changed without being written to settings.json
  function save() {
    if (!loaded) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => pywebview.api.save_setup({
      monitor: monIdx,
      camera: $("camera").value,
      mic: $("mic").value,
      blur: $("blur").classList.contains("on"),
      bubble_shape: shape,
      blur_strength: parseInt($("blurStrength").value, 10),
      bubble_scale: parseInt($("camSize").value, 10),
      mic_denoise: $("denoise").checked,
    }), 150);
  }

  function renderBlurStrength() {
    const on = $("blur").classList.contains("on");
    $("blurStrengthRow").hidden = !on;
    $("blurStrengthVal").textContent = $("blurStrength").value;
  }
  function updateBadges() {
    const set = (badge, on) => {
      badge.textContent = on ? "On" : "Off";
      badge.classList.toggle("off", !on);
    };
    set($("camBadge"), !!$("camera").value);
    set($("micBadge"), !!$("mic").value);
  }

  for (const id of ["camera", "mic"])
    $(id).addEventListener("change", () => { updateBadges(); save(); });

  $("blur").addEventListener("click", () => {
    $("blur").classList.toggle("on");
    renderBlurStrength();
    save();
  });
  $("blurStrength").addEventListener("input", () => {
    $("blurStrengthVal").textContent = $("blurStrength").value;
    save();
  });
  // resizing recreates the bubble window, so only fire when the drag ends
  $("camSize").addEventListener("input", () => {
    $("camSizeVal").textContent = $("camSize").value;
  });
  $("camSize").addEventListener("change", save);
  $("denoise").addEventListener("change", save);
  $("shape").addEventListener("click", () => {
    shape = shape === "rect" ? "circle" : "rect";
    renderShape();
    save();
  });
  $("more").addEventListener("click", () => pywebview.api.open_dashboard());
  $("close").addEventListener("click", () => pywebview.api.hide_panel());

  // live camera preview inside the card, mirroring the screen preview
  let camStream = null;
  async function updateCamPreview() {
    const g = panelGen;
    const name = $("camera").value;
    const box = $("camPreview");
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
    if (!name) { box.hidden = true; return; }
    try {
      const devs = await navigator.mediaDevices.enumerateDevices();
      const match = devs.find(d => d.kind === "videoinput" && d.label === name);
      const vc = { width: { ideal: 640 } };
      if (match) vc.deviceId = { exact: match.deviceId };
      const s = await navigator.mediaDevices.getUserMedia({ video: vc });
      // card hidden while we were awaiting → release immediately, don't leak
      if (g !== panelGen || !panelVisible) { s.getTracks().forEach(t => t.stop()); return; }
      camStream = s;
      $("camVid").srcObject = camStream;
      box.hidden = false;
    } catch (e) { box.hidden = true; }
  }
  window.onPanelHidden = () => {
    panelVisible = false; panelGen++;
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
    $("camPreview").hidden = true;
    stopMicMeter();
  };
  // belt and suspenders: if the hide notification from python ever gets
  // lost, notice within a few seconds and release the devices
  setInterval(async () => {
    if (!camStream && !micStream) return;
    let vis = panelVisible;
    try { vis = await pywebview.api.panel_visible(); } catch (e) {}
    if (!vis) window.onPanelHidden();
  }, 5000);
  $("camera").addEventListener("change", updateCamPreview);

  // live mic level meter in the mic row (Loom-style)
  let micStream = null, audioCtx = null, meterRaf = 0;
  function stopMicMeter() {
    cancelAnimationFrame(meterRaf);
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    const c = $("micWave").getContext("2d");
    c.clearRect(0, 0, 52, 22);
  }
  async function startMicMeter() {
    stopMicMeter();
    const g = panelGen;
    const name = $("mic").value;
    if (!name) return;
    try {
      const devs = await navigator.mediaDevices.enumerateDevices();
      const match = devs.find(d => d.kind === "audioinput" && d.label === name);
      const ac = { };
      if (match) ac.deviceId = { exact: match.deviceId };
      const s = await navigator.mediaDevices.getUserMedia({ audio: ac });
      if (g !== panelGen || !panelVisible) { s.getTracks().forEach(t => t.stop()); return; }
      micStream = s;
      audioCtx = new AudioContext();
      const src = audioCtx.createMediaStreamSource(micStream);
      const an = audioCtx.createAnalyser();
      an.fftSize = 64;
      src.connect(an);
      const data = new Uint8Array(an.frequencyBinCount);
      const ctx = $("micWave").getContext("2d");
      const BARS = 13;
      const draw = () => {
        an.getByteFrequencyData(data);
        ctx.clearRect(0, 0, 52, 22);
        for (let i = 0; i < BARS; i++) {
          const v = data[Math.floor(i * data.length / BARS)] / 255;
          const h = Math.max(2, v * 20);
          ctx.fillStyle = v > 0.02 ? "#55c07a" : "#3a3d44";
          ctx.fillRect(i * 4, 11 - h / 2, 3, h);
        }
        meterRaf = requestAnimationFrame(draw);
      };
      draw();
    } catch (e) {}
  }
  $("mic").addEventListener("change", startMicMeter);

  // after each recording the app reports the copied link here
  window.setLastLink = (url) => {
    $("lastUrl").textContent = url.replace(/^https?:\/\//, "");
    $("lastLink").hidden = false;
    $("lastCopy").onclick = () => navigator.clipboard.writeText(url);
  };
  $("start").addEventListener("click", async () => {
    save();
    await new Promise(r => setTimeout(r, 200));
    pywebview.api.start_recording();
  });

  window.addEventListener("pywebviewready", load);
</script>
<script>
  // page zoom persists in the WebView2 profile and breaks fixed layouts
  addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  addEventListener("keydown", (e) => {
    if (e.ctrlKey && ["=", "-", "+", "0"].includes(e.key)) e.preventDefault();
  });
</script>
</body>
</html>
