<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Loom-style vertical toolbar, left edge of the recorded screen.
     Capture-excluded by default so it stays out of recordings. */
  :root {
    --bg: rgba(18, 19, 23, 0.97); --line: #2e3138; --text: #e8e9eb;
    --muted: #9aa0a8; --live: #ff4545;
    --mono: "Roboto Mono", "Cascadia Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .bar {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    width: 56px; margin: 2px; padding: 10px 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: 16px;
    color: var(--text); font: 12px "Roboto", "Segoe UI", system-ui;
  }
  .drag { height: 8px; width: 26px; border-radius: 3px; cursor: grab;
          background: var(--line); margin-bottom: 6px; flex: none; }
  .time {
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 13px; font-weight: 600; color: var(--text);
    padding: 2px 0 6px; text-align: center;
  }
  .dot {
    display: block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--live); margin: 0 auto 4px;
    animation: pulse 1.6s ease infinite;
  }
  .paused .dot { background: var(--muted); animation: none; }
  .paused .time { color: var(--muted); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  button {
    background: none; border: none; border-radius: 10px; color: var(--text);
    width: 42px; height: 40px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; position: relative; flex: none;
  }
  button:hover { background: rgba(255, 255, 255, 0.1); }
  button svg { width: 19px; height: 19px; fill: currentColor; }
  button.stop { color: var(--live); }
  button.active { color: #7aa5ff; background: rgba(80, 130, 255, 0.15); }
  button .tip {
    position: absolute; left: 50px; top: 50%; transform: translateY(-50%);
    background: #22252b; border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 9px; font-size: 11.5px; white-space: nowrap; display: none;
    color: var(--text); z-index: 5;
  }
  button:hover .tip { display: block; }
  .sep { height: 1px; width: 26px; background: var(--line); margin: 4px 0; }
  .confirm {
    position: fixed; inset: 0; background: var(--bg); border-radius: 16px;
    display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; font: 11.5px "Roboto", system-ui;
    color: var(--text); border: 1px solid var(--line); text-align: center;
    padding: 6px; z-index: 10;
  }
  .confirm.show { display: flex; }
  .confirm button {
    width: 44px; height: 30px; font: 600 11px system-ui;
    border: 1px solid var(--line); border-radius: 7px;
  }
  .confirm .yes { background: var(--live); border: none; color: #fff; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="drag pywebview-drag-region" title="Drag"></div>
    <button class="stop" id="stop"><span class="tip">Stop — link goes to clipboard</span>
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </button>
    <div class="time"><span class="dot"></span><span id="time">0:00</span></div>
    <button id="pause"><span class="tip">Pause</span>
      <svg id="icoPause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
      <svg id="icoResume" viewBox="0 0 24 24" style="display:none"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="restart"><span class="tip">Restart take</span>
      <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    </button>
    <button id="trash"><span class="tip">Trash take — nothing uploads</span>
      <svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9z"/></svg>
    </button>
    <div class="sep"></div>
    <button id="draw"><span class="tip">Draw on screen (Ctrl+Alt+D)</span>
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7a1 1 0 0 0 0-1.4L18.4 3.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.75 3.75L20.7 7z"/></svg>
    </button>
    <button id="cam"><span class="tip">Camera on/off</span>
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </button>
    <button id="blur"><span class="tip">Background blur</span>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3"/></svg>
    </button>
  </div>
  <div class="confirm" id="confirm">
    <span>Trash this take?</span>
    <button class="yes" id="confirmYes">Yes</button>
    <button id="confirmNo">No</button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => {
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    const mm = h ? String(m).padStart(2, "0") : m;
    return (h ? h + ":" : "") + mm + ":" + String(s % 60).padStart(2, "0");
  };

  async function poll() {
    try {
      const st = await pywebview.api.get_state();
      $("time").textContent = fmt(st.elapsed);
      document.body.classList.toggle("paused", st.state === "PAUSED");
      $("icoPause").style.display = st.state === "PAUSED" ? "none" : "";
      $("icoResume").style.display = st.state === "PAUSED" ? "" : "none";
    } catch (e) {}
  }
  window.addEventListener("pywebviewready", () => setInterval(poll, 250));

  $("stop").onclick = () => pywebview.api.stop();
  $("pause").onclick = () => pywebview.api.pause_resume();
  $("restart").onclick = () => pywebview.api.restart();
  $("trash").onclick = () => $("confirm").classList.add("show");
  $("confirmNo").onclick = () => $("confirm").classList.remove("show");
  $("confirmYes").onclick = () => {
    $("confirm").classList.remove("show");
    pywebview.api.trash();
  };
  $("draw").onclick = async () => {
    $("draw").classList.toggle("active", await pywebview.api.toggle_draw());
  };
  $("cam").onclick = async () => {
    $("cam").classList.toggle("active", !(await pywebview.api.toggle_camera()));
  };
  $("blur").onclick = async () => {
    $("blur").classList.toggle("active", await pywebview.api.toggle_blur());
  };
</script>
<script>
  addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  addEventListener("keydown", (e) => {
    if (e.ctrlKey && ["=", "-", "+", "0"].includes(e.key)) e.preventDefault();
  });
</script>
</body>
</html>
